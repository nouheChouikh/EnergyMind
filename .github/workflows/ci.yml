# Continuous integration: on every pull request into main (each push to its branch reruns it),
# rebuild the dataset with the pinned versions and check that it matches what is committed.
# Also runnable by hand from the Actions tab.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    name: Dataset rebuild and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the repository
        uses: actions/checkout@v5

      - name: Set up Python (the exact version the dataset is built with)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: dataset/builder/requirements.txt

      - name: Install the pinned libraries
        run: pip install -r dataset/builder/requirements.txt

      - name: Rebuild the dataset and run its checks (fails if any check fails)
        run: python dataset/builder/build_dataset.py --skip-notebook

      - name: The committed dataset is exactly what the code produces
        run: |
          git status --porcelain -- dataset/data
          git diff --stat -- dataset/data
          test -z "$(git status --porcelain -- dataset/data)"
